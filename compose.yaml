services:
  workshop:
    build: .
    env_file:
      - .env
    environment:
      WORKSHOP_HOST: 0.0.0.0
      WORKSHOP_PORT: "8000"
      WORKSHOP_DB: /data/state/workshop.db
    ports:
      - "127.0.0.1:${WORKSHOP_LOCAL_PORT:-8000}:8000"
    volumes:
      - workshop-data:/data

volumes:
  workshop-data:
